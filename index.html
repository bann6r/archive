
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bann6r's post archives</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="loveyall.css">
</head>

<body>
  <main id="archive">
    <!-- @bann6r -->
  </main>

  <script>
    async function loadArchive() {
      const response = await fetch("posts.xml");

      if (!response.ok) {
        throw new Error(`Could not load posts.xml: ${response.status}`);
      }

      const xmlText = await response.text();
      const xml = new DOMParser().parseFromString(
        xmlText,
        "application/xml"
      );

      if (xml.querySelector("parsererror")) {
        document.querySelector("#archive").textContent =
          "Could not read posts.xml. Please check its XML formatting.";
        return;
      }

      const archive = document.querySelector("#archive");
      const posts = xml.querySelectorAll("archive > post");

      posts.forEach((post, index) => {
        if (index > 0) {
          const divider = document.createElement("hr");
          divider.className = "post-divider";
          archive.appendChild(divider);
        }

        const article = document.createElement("article");
        article.className = "post";

        // POST HEADER
        const header = document.createElement("header");
        header.className = "post-header";

        const avatar = document.createElement("img");
        avatar.className = "avatar";
        avatar.src =
          post.querySelector("avatar")?.textContent.trim() || "";
        avatar.alt =
          `${post.querySelector("username")?.textContent.trim() || "User"}'s profile picture`;

        const headerContent = document.createElement("div");
        headerContent.className = "header-content";

        const headerRow = document.createElement("div");
        headerRow.className = "header-row";

        const username = document.createElement("span");
        username.className = "username";
        username.textContent =
          post.querySelector("username")?.textContent.trim() || "";

        const date = document.createElement("time");
        date.className = "date";

        const dateElement = post.querySelector("date");
        date.textContent = dateElement?.textContent.trim() || "";

        if (dateElement?.getAttribute("datetime")) {
          date.dateTime = dateElement.getAttribute("datetime");
        }

        const platform = document.createElement("span");
        platform.className = "platform";

        const platformName =
          post.querySelector("platform")?.textContent.trim().toLowerCase();

        const icons = {
          threads: "icons/threads.svg",
          bsky: "icons/bsky.svg"
        };

        if (icons[platformName]) {
          const platformIcon = document.createElement("img");
          platformIcon.className = "threads-icon";
          platformIcon.src = icons[platformName];
          platformIcon.alt = `Posted on ${platformName}`;
          platform.appendChild(platformIcon);
        }

        headerRow.append(username, date, platform);
        headerContent.appendChild(headerRow);
        header.append(avatar, headerContent);

        // POST CONTENT
        const content = document.createElement("div");
        content.className = "post-content";

        const text = document.createElement("p");
        text.className = "post-text";
        text.textContent =
          post.querySelector("text")?.textContent.trim() || "";

        content.appendChild(text);

        // IMAGE POSTS AND CAROUSELS
        const images = post.querySelectorAll("images > image");

        if (images.length === 1) {
          // A single image: no carousel wrappers or controls.
          const image = document.createElement("img");
          image.className = "post-single-image";
          image.src = images[0].textContent.trim();
          image.alt = "Image attached to post";
          image.loading = "lazy";

          content.appendChild(image);

        } else if (images.length > 1) {
          // Multiple images: swipeable carousel with arrow controls.
          const carousel = document.createElement("div");
          carousel.className = "post-carousel";

          const track = document.createElement("div");
          track.className = "carousel-track";
          track.setAttribute("aria-label", "Post images");

          [...images].reverse().forEach((imageElement, imageIndex) => {
            const slide = document.createElement("div");
            slide.className = "carousel-slide";

            const image = document.createElement("img");
            image.src = imageElement.textContent.trim();
            image.alt = `Image ${imageIndex + 1} of ${images.length}`;
            image.loading = imageIndex === 0 ? "eager" : "lazy";
            image.draggable = false;

            slide.appendChild(image);
            track.appendChild(slide);
          });

          carousel.appendChild(track);

          const previous = document.createElement("button");
          previous.className = "carousel-arrow carousel-previous";
          previous.type = "button";
          previous.textContent = "‹";
          previous.setAttribute("aria-label", "Previous image");
          previous.hidden = true;

          const next = document.createElement("button");
          next.className = "carousel-arrow carousel-next";
          next.type = "button";
          next.textContent = "›";
          next.setAttribute("aria-label", "Next image");

          const updateArrows = () => {
            const maxScroll = track.scrollWidth - track.clientWidth;

            previous.hidden = track.scrollLeft <= 2;
            next.hidden =
              maxScroll <= 2 ||
              track.scrollLeft >= maxScroll - 2;
          };

          previous.addEventListener("click", () => {
            track.scrollBy({
              left: -track.clientWidth,
              behavior: "smooth"
            });
          });

          next.addEventListener("click", () => {
            track.scrollBy({
              left: track.clientWidth,
              behavior: "smooth"
            });
          });

          track.addEventListener("scroll", updateArrows);
          window.addEventListener("resize", updateArrows);

          carousel.append(previous, next);
          content.appendChild(carousel);

          // Update arrow visibility after layout and image loading.
          requestAnimationFrame(updateArrows);

          track.querySelectorAll("img").forEach((image) => {
            image.addEventListener("load", updateArrows, {
              once: true
            });
          });
        }

        // VIDEO POSTS
        const videoPath =
          post.querySelector("video")?.textContent.trim();

        if (videoPath) {
          const video = document.createElement("video");
          video.className = "post-video";
          video.controls = true;
          video.preload = "metadata";
          video.playsInline = true;

          const source = document.createElement("source");
          source.src = videoPath;
          source.type = "video/mp4";

          video.appendChild(source);
          content.appendChild(video);
        }

        // POST ACTIONS
        const actions = document.createElement("div");
        actions.className = "actions";
        actions.setAttribute("aria-label", "Post actions");

        const actionIcons = [
          ["Like", "icons/love.svg"],
          ["Comment", "icons/comment.svg"],
          ["Repost", "icons/repost.svg"]
        ];

        actionIcons.forEach(([label, src]) => {
          const action = document.createElement("span");
          action.className = "action";
          action.title = label;

          const icon = document.createElement("img");
          icon.src = src;
          icon.alt = "";

          action.appendChild(icon);
          actions.appendChild(action);
        });

        content.appendChild(actions);
        article.append(header, content);
        archive.appendChild(article);
      });
    }

    loadArchive().catch((error) => {
      console.error("Archive loading failed:", error);
      document.querySelector("#archive").textContent =
        "ERROR: Could not load the archive. Check the browser console.";
    });
  </script>
</body>
</html>
